name: SianReversi
options:
  bundleIdPrefix: com.atomawayg
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "3.24.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SianReversi:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "เซียน"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSPhotoLibraryAddUsageDescription: "เซฟคลิปเกมพูลที่อัดไว้ลงรูปภาพ"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atomawayg.sianreversi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SianBroadcast
        embed: true
      - sdk: ReplayKit.framework
      - sdk: AVKit.framework
  SianBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: "เซียน"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        NSPhotoLibraryAddUsageDescription: "เซฟคลิปเกมพูลที่อัดไว้ลงรูปภาพ"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atomawayg.sianreversi.broadcast
    dependencies:
      - sdk: ReplayKit.framework
