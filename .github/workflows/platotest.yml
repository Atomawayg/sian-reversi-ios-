name: PlatoTest
on:
  push:
    branches: ['platotest/**']
permissions:
  contents: read
jobs:
  platotest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          S=Tools/PlatoTest/Sources/PlatoTest
          cp App/ChessEngine.swift App/DraughtsEngine.swift Broadcast/PlatoBoardReader.swift Broadcast/PlatoChessData.swift Shared/BoardMessage.swift $S/
          swift build -c release --package-path Tools/PlatoTest 2>&1 | grep -vE "^\[[0-9]+/[0-9]+\]" | tail -40
      - name: Debug
        run: |
          B=$(swift build -c release --package-path Tools/PlatoTest --show-bin-path)/PlatoTest
          $B dbg Tools/PlatoTest/frames/chess_u2.ppm | tee d.txt
          while read -r l; do echo "::notice title=dbg::$l"; done < d.txt
      - name: Read frames
        run: |
          B=$(swift build -c release --package-path Tools/PlatoTest --show-bin-path)/PlatoTest
          $B read | tee r.txt
          while read -r l; do echo "::notice title=read::$l"; done < r.txt
      - name: Search
        run: |
          B=$(swift build -c release --package-path Tools/PlatoTest --show-bin-path)/PlatoTest
          $B search | tee s.txt
          while read -r l; do echo "::notice title=search::$l"; done < s.txt
